<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Turfora · Add Time Slot</title>

    <!-- Font Awesome 6 -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />

    <!-- Google Font: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap"
        rel="stylesheet" />

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #f0f5fc;
            color: #0b1d2b;
            padding: 1.5rem;
        }

        .admin-wrapper {
            max-width: 1440px;
            margin: 0 auto;
        }

        /* header */
        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem 2rem;
            background: #ffffff;
            padding: 1.2rem 2.5rem;
            border-radius: 28px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.04);
            margin-bottom: 2rem;
        }

        .admin-header .logo {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            font-size: 1.5rem;
            font-weight: 700;
        }

        .admin-header .logo svg {
            width: 36px;
            height: 36px;
        }

        .admin-header .logo span {
            background: linear-gradient(145deg, #0b1d2b, #1a5cff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .admin-header .logo small {
            font-size: 0.7rem;
            font-weight: 500;
            color: #5d7388;
            background: #eef3f8;
            padding: 0.2rem 0.8rem;
            border-radius: 30px;
            -webkit-text-fill-color: #5d7388;
            margin-left: 0.3rem;
        }

        .admin-header .admin-info {
            display: flex;
            align-items: center;
            gap: 1.2rem;
        }

        .admin-header .admin-info .badge {
            background: #eef6ff;
            color: #1a5cff;
            padding: 0.3rem 1rem;
            border-radius: 40px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .admin-header .admin-info .avatar {
            width: 44px;
            height: 44px;
            border-radius: 30px;
            background: #1a5cff;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
        }

        /* main content */
        .dashboard-layout {
            display: block;
        }

        .main-content {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        /* page header */
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .page-header h2 {
            font-size: 1.6rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        .page-header h2 i {
            color: #1a5cff;
        }

        .page-header .subtitle {
            color: #5d7388;
            font-size: 0.9rem;
            font-weight: 400;
        }

        /* card */
        .avail-card {
            background: #ffffff;
            border-radius: 28px;
            padding: 1.8rem 2rem;
            border: 1px solid #edf2f7;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
            max-width: 540px;
        }

        .avail-card .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.8rem;
            margin-bottom: 1.4rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid #edf2f7;
        }

        .avail-card .card-header h3 {
            font-size: 1.1rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        .avail-card .card-header h3 i {
            color: #1a5cff;
        }

        .avail-card .card-header .turf-badge {
            background: #e5efff;
            color: #1a5cff;
            font-size: 0.75rem;
            font-weight: 600;
            padding: 0.25rem 0.9rem;
            border-radius: 30px;
        }

        /* form */
        .form-group {
            margin-bottom: 1.2rem;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            font-size: 0.85rem;
            color: #1e3a5f;
            margin-bottom: 0.4rem;
        }

        .form-group label i {
            color: #7a94af;
            margin-right: 0.3rem;
            width: 16px;
        }

        .form-group input[type="time"] {
            width: 100%;
            padding: 0.75rem 1rem;
            border-radius: 16px;
            border: 1.5px solid #e2eaf2;
            background: #fafcff;
            font-family: inherit;
            font-size: 0.95rem;
            outline: none;
            transition: 0.15s;
            color: #0b1d2b;
        }

        .form-group input[type="time"]:focus {
            border-color: #1a5cff;
            box-shadow: 0 4px 14px rgba(26, 92, 255, 0.08);
            background: #fff;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        /* hint text */
        .form-hint {
            font-size: 0.78rem;
            color: #7a94af;
            margin-top: 0.3rem;
        }

        /* divider */
        .form-divider {
            border: none;
            border-top: 1px solid #edf2f7;
            margin: 1.4rem 0;
        }

        /* actions */
        .form-actions {
            display: flex;
            gap: 0.8rem;
            flex-wrap: wrap;
        }

        /* buttons */
        .btn {
            padding: 0.65rem 1.6rem;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.9rem;
            border: none;
            cursor: pointer;
            transition: 0.15s;
            font-family: inherit;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            text-decoration: none;
        }

        .btn-primary {
            background: #1a5cff;
            color: white;
            box-shadow: 0 6px 20px -6px rgba(26, 92, 255, 0.35);
        }

        .btn-primary:hover {
            background: #0f4ad6;
            transform: scale(1.02);
        }

        .btn-outline {
            background: transparent;
            color: #1e3a5f;
            border: 1.5px solid #d0dce8;
        }

        .btn-outline:hover {
            background: #f2f6fe;
            border-color: #b0c6dd;
        }

        /* responsive */
        @media (max-width: 640px) {

            body {
                padding: 0.8rem;
            }

            .admin-header {
                padding: 1rem 1.2rem;
                flex-direction: column;
                align-items: flex-start;
            }

            .avail-card {
                padding: 1.2rem 1rem;
            }

            .form-row {
                grid-template-columns: 1fr;
            }

            .page-header {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</head>

<body>

    <div class="admin-wrapper">

        <!-- header -->
        <header class="admin-header">

            <div class="logo">
                <svg viewBox="0 0 64 64" fill="none"
                    xmlns="http://www.w3.org/2000/svg"
                    style="width:36px;height:36px;">

                    <rect x="4" y="20" width="56" height="28" rx="14"
                        fill="#8BC34A" opacity="0.9" />

                    <rect x="8" y="24" width="48" height="20" rx="10"
                        fill="#689F38" opacity="0.7" />

                    <path d="M18 26 L28 20 L38 26 L32 34 L26 34 L18 26Z"
                        fill="#CDDC39" opacity="0.9" />

                    <path d="M32 20 L38 14 L44 20 L40 26 L34 26 L32 20Z"
                        fill="#FFEB3B" opacity="0.8" />

                    <circle cx="32" cy="40" r="6"
                        fill="#33691E" opacity="0.6" />

                    <circle cx="32" cy="40" r="3"
                        fill="#AFB42B" opacity="0.9" />
                </svg>

                <span>Turfora</span>
                <small>Admin</small>
            </div>

            <div class="admin-info">
                <span class="badge">
                    <i class="fas fa-shield-alt"></i>
                    Super Admin
                </span>

                <span style="font-weight:500;font-size:0.9rem;">
                    admin@turfora.com
                </span>

                <div class="avatar">A</div>
            </div>

        </header>


        <!-- main content -->
        <div class="dashboard-layout">

            <div class="main-content">

                <!-- page header -->
                <div class="page-header">

                    <div>
                        <h2>
                            <i class="fas fa-clock"></i>
                            Add Time Slot
                        </h2>

                        <span class="subtitle">
                            Define a new bookable hour for this turf
                        </span>
                    </div>

                    <a href="{% url 'turf_availability' turf.id %}"
                        class="btn btn-outline">

                        <i class="fas fa-arrow-left"></i>
                        Back to Availability

                    </a>

                </div>


                <!-- form card -->
                <div class="avail-card">

                    <div class="card-header">

                        <h3>
                            <i class="fas fa-plus-circle"></i>
                            New Time Slot
                        </h3>

                        <span class="turf-badge">

                            <i class="fas fa-map-marker-alt"></i>

                            {{ turf.turf_name }}

                        </span>

                    </div>


                    <form method="POST">

                        {% csrf_token %}

                        <div class="form-row">

                            <div class="form-group">

                                <label for="startTime">

                                    <i class="fas fa-play"></i>
                                    Start Time

                                </label>

                                <input type="time"
                                    id="startTime"
                                    name="start_time"
                                    required>

                                <p class="form-hint">
                                    e.g. 06:00 AM
                                </p>

                            </div>


                            <div class="form-group">

                                <label for="endTime">

                                    <i class="fas fa-stop"></i>
                                    End Time

                                </label>

                                <input type="time"
                                    id="endTime"
                                    name="end_time"
                                    required>

                                <p class="form-hint">
                                    e.g. 07:00 AM
                                </p>

                            </div>

                        </div>


                        <hr class="form-divider">


                        <div class="form-actions">

                            <button type="submit"
                                class="btn btn-primary">

                                <i class="fas fa-plus"></i>
                                Add Slot

                            </button>


                            <a href="{% url 'turf_availability' turf.id %}"
                                class="btn btn-outline">

                                <i class="fas fa-times"></i>
                                Cancel

                            </a>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</body>

</html>
