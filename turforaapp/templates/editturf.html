<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Turfora · Edit Turf</title>
    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <!-- Google Font: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap"
        rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #f0f5fc;
            color: #0b1d2b;
            padding: 1.5rem;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .edit-turf-container {
            max-width: 820px;
            width: 100%;
            background: #ffffff;
            border-radius: 48px;
            box-shadow: 0 30px 60px -20px rgba(0, 20, 30, 0.25), 0 10px 30px -10px rgba(0, 0, 0, 0.05);
            padding: 3rem 3.5rem;
            transition: all 0.2s ease;
        }

        /* header */
        .page-header {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding-bottom: 1.8rem;
            border-bottom: 1px solid #edf2f7;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }

        .page-header .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: #5d7388;
            text-decoration: none;
            font-weight: 500;
            transition: 0.15s;
            padding: 0.4rem 1rem;
            border-radius: 40px;
            background: #f0f5fc;
            font-size: 0.9rem;
        }

        .page-header .back-btn:hover {
            background: #e5edf5;
            color: #1a5cff;
        }

        .page-header .title-group h2 {
            font-size: 1.6rem;
            font-weight: 700;
            color: #0b1d2b;
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        .page-header .title-group h2 i {
            color: #f5a623;
        }

        .page-header .title-group .sub {
            color: #5d7388;
            font-size: 0.9rem;
        }

        /* logo mini */
        .logo-mini {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-left: auto;
            font-weight: 700;
            font-size: 1.1rem;
            color: #0b1d2b;
        }

        .logo-mini svg {
            width: 30px;
            height: 30px;
        }

        .logo-mini span {
            background: linear-gradient(145deg, #0b1d2b, #1a5cff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* form */
        .edit-form {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.2rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        .form-group label {
            font-weight: 600;
            font-size: 0.85rem;
            letter-spacing: 0.3px;
            color: #1e3a5f;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .form-group label i {
            color: #7a94af;
            width: 18px;
            font-size: 0.9rem;
        }

        .form-group label .required {
            color: #e54c4c;
            font-size: 1.1rem;
        }

        .form-group .input-wrapper {
            display: flex;
            align-items: center;
            background: #fafcff;
            border-radius: 20px;
            border: 1.5px solid #e2eaf2;
            transition: 0.2s ease;
            padding: 0 1.2rem;
        }

        .form-group .input-wrapper:focus-within {
            border-color: #1a5cff;
            background: #ffffff;
            box-shadow: 0 4px 14px rgba(26, 92, 255, 0.08);
        }

        .form-group .input-wrapper input,
        .form-group .input-wrapper select,
        .form-group .input-wrapper textarea {
            width: 100%;
            padding: 0.85rem 0 0.85rem 0.6rem;
            border: none;
            background: transparent;
            font-size: 1rem;
            font-family: inherit;
            color: #0b1d2b;
            outline: none;
        }

        .form-group .input-wrapper input::placeholder,
        .form-group .input-wrapper textarea::placeholder {
            color: #a0b8cf;
            font-weight: 400;
        }

        .form-group .input-wrapper select {
            cursor: pointer;
            appearance: none;
            -webkit-appearance: none;
            background: transparent;
        }

        .form-group .input-wrapper textarea {
            resize: vertical;
            min-height: 80px;
            padding: 0.85rem 0.6rem 0.85rem 0;
        }

        .form-group .field-hint {
            font-size: 0.75rem;
            color: #6f8aa3;
            padding-left: 2.2rem;
            margin-top: 0.1rem;
        }

        /* status toggle */
        .status-toggle {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 0.3rem 0;
        }

        .status-toggle .status-badge {
            padding: 0.3rem 1.2rem;
            border-radius: 30px;
            font-size: 0.8rem;
            font-weight: 700;
        }

        .status-badge.active {
            background: #e3f0e5;
            color: #1d6b3c;
        }

        .status-badge.inactive {
            background: #f0f0f0;
            color: #7a7a7a;
        }

        .status-toggle select {
            padding: 0.4rem 1.2rem;
            border-radius: 30px;
            border: 1.5px solid #dce4ed;
            background: white;
            font-family: inherit;
            font-size: 0.85rem;
            font-weight: 500;
            color: #1e3a5f;
            outline: none;
            cursor: pointer;
        }

        /* image upload */
        .image-upload {
            border: 2px dashed #dce4ed;
            border-radius: 20px;
            padding: 1.5rem;
            text-align: center;
            background: #fafcff;
            transition: 0.15s;
        }

        .image-upload i {
            font-size: 2.5rem;
            color: #7a94af;
            margin-bottom: 0.5rem;
            display: block;
        }

        .image-upload p {
            color: #5d7388;
            font-size: 0.9rem;
        }

        .image-upload .file-name {
            color: #1a5cff;
            font-weight: 600;
            margin-top: 0.3rem;
        }

        .image-preview {
            display: flex;
            gap: 0.8rem;
            flex-wrap: wrap;
            margin-top: 1rem;
        }

        .image-preview .preview-item {
            position: relative;
            width: 100px;
            height: 80px;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #edf2f7;
        }

        .image-preview .preview-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .image-preview .preview-item .remove-img {
            position: absolute;
            top: -6px;
            right: -6px;
            background: #e54c4c;
            color: white;
            border: none;
            border-radius: 50%;
            width: 22px;
            height: 22px;
            font-size: 0.7rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* actions */
        .form-actions {
            display: flex;
            gap: 1rem;
            margin-top: 0.5rem;
            padding-top: 1.8rem;
            border-top: 1px solid #edf2f7;
            flex-wrap: wrap;
            align-items: center;
        }

        .btn {
            padding: 0.8rem 2.2rem;
            border-radius: 60px;
            font-weight: 600;
            font-size: 1rem;
            border: none;
            cursor: pointer;
            transition: 0.2s ease;
            font-family: inherit;
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            text-decoration: none;
        }

        .btn-primary {
            background: #1a5cff;
            color: white;
            box-shadow: 0 8px 24px -8px rgba(26, 92, 255, 0.35);
        }

        .btn-primary:hover {
            background: #0f4ad6;
            transform: scale(1.02);
            box-shadow: 0 12px 32px -10px rgba(26, 92, 255, 0.45);
        }

        .btn-outline {
            background: transparent;
            color: #1e3a5f;
            border: 1.5px solid #d0dce8;
        }

        .btn-outline:hover {
            background: #f2f6fe;
            border-color: #b0c6dd;
        }

        .btn-danger {
            background: #e54c4c;
            color: white;
        }

        .btn-danger:hover {
            background: #c9302c;
        }

        /* responsive */
        @media (max-width: 640px) {
            .edit-turf-container {
                padding: 1.8rem 1.5rem;
                border-radius: 32px;
            }

            .page-header {
                flex-wrap: wrap;
            }

            .page-header .title-group h2 {
                font-size: 1.3rem;
            }

            .logo-mini {
                margin-left: 0;
            }

            .form-row {
                grid-template-columns: 1fr;
            }

            .form-group .input-wrapper input,
            .form-group .input-wrapper select,
            .form-group .input-wrapper textarea {
                padding: 0.75rem 0 0.75rem 0.4rem;
                font-size: 0.95rem;
            }

            .form-actions {
                flex-direction: column;
                align-items: stretch;
            }

            .btn {
                justify-content: center;
                padding: 0.8rem 1.5rem;
            }

            .image-preview .preview-item {
                width: 80px;
                height: 60px;
            }
        }

        @media (max-width: 420px) {
            .edit-turf-container {
                padding: 1.2rem 1rem;
                border-radius: 24px;
            }
        }

        .delete-form {
            display: flex;
            justify-content: flex-end;
            margin-top: -58px;
        }
    </style>
</head>

<body>

    <div class="edit-turf-container">

        <!-- header -->
        <div class="page-header">
            <a href="{% url 'manageturfs' %}" class="back-btn"><i class="fas fa-arrow-left"></i> Back</a>
            <div class="title-group">
                <h2><i class="fas fa-edit"></i> Edit Turf</h2>
                <span class="sub">Update turf information</span>
            </div>
            <div class="logo-mini">
                <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" style="width:30px;height:30px;">
                    <rect x="4" y="20" width="56" height="28" rx="14" fill="#8BC34A" opacity="0.9" />
                    <rect x="8" y="24" width="48" height="20" rx="10" fill="#689F38" opacity="0.7" />
                    <path d="M18 26 L28 20 L38 26 L32 34 L26 34 L18 26Z" fill="#CDDC39" opacity="0.9" />
                    <path d="M32 20 L38 14 L44 20 L40 26 L34 26 L32 20Z" fill="#FFEB3B" opacity="0.8" />
                    <circle cx="32" cy="40" r="6" fill="#33691E" opacity="0.6" />
                    <circle cx="32" cy="40" r="3" fill="#AFB42B" opacity="0.9" />
                </svg>
                <span>Turfora</span>
            </div>
        </div>

        <!-- edit form -->
        <form class="edit-form" method="POST" enctype="multipart/form-data">
            <!-- CSRF Token -->
            <input type="hidden" name="csrfmiddlewaretoken" value="{{ csrf_token }}" />

            <!-- Turf Name & Turf Type -->
            <div class="form-row">
                <div class="form-group">
                    <label for="turfName"><i class="fas fa-font"></i> Turf Name <span class="required">*</span></label>
                    <div class="input-wrapper">
                        <input type="text" id="turfName" name="turf_name" value="{{turf.turf_name}}" required />
                    </div>
                </div>
                <div class="form-group">
                    <label for="turfType"><i class="fas fa-futbol"></i> Turf Type <span
                            class="required">*</span></label>
                    <div class="input-wrapper">
                        <select id="turfType" name="turf_type">
                            <option value="Football" {% if turf.turf_type == "Football" %}selected{% endif %}>
                                Football
                            </option>

                            <option value="Cricket" {% if turf.turf_type == "Cricket" %}selected{% endif %}>
                                Cricket
                            </option>

                            <option value="Multipurpose" {% if turf.turf_type == "Multipurpose" %}selected{% endif %}>
                                Multipurpose
                            </option>

                            <option value="Basketball" {% if turf.turf_type == "Basketball" %}selected{% endif %}>
                                Basketball
                            </option>

                            <option value="Badminton" {% if turf.turf_type == "Badminton" %}selected{% endif %}>
                                Badminton
                            </option>

                            <option value="Tennis" {% if turf.turf_type == "Tennis" %}selected{% endif %}>
                                Tennis
                            </option>


                        </select>
                    </div>
                </div>
            </div>

            <!-- Location & Price -->
            <div class="form-row">
                <div class="form-group">
                    <label for="location"><i class="fas fa-map-pin"></i> Location <span
                            class="required">*</span></label>
                    <div class="input-wrapper">
                        <input type="text" id="location" name="location" value="{{turf.location}}" required />
                    </div>
                </div>
                <div class="form-group">
                    <label for="price"><i class="fas fa-tag"></i> Price / Hour (₹) <span
                            class="required">*</span></label>
                    <div class="input-wrapper">
                        <input type="number" id="price" name="price_per_hour" value="{{turf.price_per_hour}}"
                            required />
                    </div>
                </div>
            </div>

            <!-- Address -->
            <div class="form-group">
                <label for="address"><i class="fas fa-address-card"></i> Address <span class="required">*</span></label>
                <div class="input-wrapper">
                    <input type="text" id="address" name="address" value="{{turf.address}}" required />
                </div>
            </div>

            <!-- Description -->
            <div class="form-group">
                <label for="description"><i class="fas fa-align-left"></i> Description</label>
                <div class="input-wrapper">
                    <textarea id="description" name="description" rows="3">{{ turf.description }}</textarea>
                </div>
            </div>

            <!-- Opening Time & Closing Time -->
            <div class="form-row">
                <div class="form-group">
                    <label for="openingTime"><i class="fas fa-clock"></i> Opening Time <span
                            class="required">*</span></label>
                    <div class="input-wrapper">
                        <input type="time" id="openingTime" name="opening_time" value="{{turf.opening_time|time:'H:i'}}"
                            required />
                    </div>
                </div>
                <div class="form-group">
                    <label for="closingTime"><i class="fas fa-clock"></i> Closing Time <span
                            class="required">*</span></label>
                    <div class="input-wrapper">
                        <input type="time" id="closingTime" name="closing_time" value="{{turf.closing_time|time:'H:i'}}"
                            required />
                    </div>
                </div>
            </div>

            <!-- Status -->
            <div class="form-group">
                <label><i class="fas fa-toggle-on"></i> Status</label>
                <div class="status-toggle">
                    <span class="status-badge active">Active</span>
                    <select name="status">
                        <option value="active" {% if turf.status == "active" %}selected{% endif %}>
                            Active
                        </option>

                        <option value="inactive" {% if turf.status == "inactive" %}selected{% endif %}>
                            Inactive
                        </option>

                        <option value="maintenance" {% if turf.status == "maintenance" %}selected{% endif %}>
                            Maintenance
                        </option>
                    </select>
                </div>
            </div>

            <!-- Facilities -->
            <div class="form-group">
                <label for="facilities"><i class="fas fa-check-circle"></i> Facilities (comma separated)</label>
                <div class="input-wrapper">
                    <input type="text" id="facilities" name="available_facilities"
                        value="{{turf.available_facilities}}" />
                </div>
                <div class="field-hint">Separate each facility with a comma.</div>
            </div>

            <!-- Images -->
            <div class="form-group">
                <label><i class="fas fa-image"></i> Images (URLs, one per line)</label>
                <div class="image-upload">
                    {% if turf.image %}
                    <img src="{{ turf.image.url }}" alt="{{ turf.turf_name }}"
                        style="width:150px;height:100px;object-fit:cover;border-radius:12px;margin-bottom:10px;">
                    {% else %}
                    <i class="fas fa-cloud-upload-alt"></i>
                    <p>No image uploaded</p>
                    {% endif %}

                    <p>Select a new image to replace the current image</p>

                    <input type="file" id="image" name="image" accept="image/png,image/jpeg,image/jpg">

                    <p style="font-size:0.75rem;color:#a0b8cf;">
                        PNG, JPG, JPEG (Max 5MB)
                    </p>

                </div>

            </div>

            <!-- actions -->
            <div class="form-actions">

                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-save"></i> Update Turf
                </button>

                <a href="{% url 'manageturfs' %}" class="btn btn-outline">
                    <i class="fas fa-times"></i> Cancel
                </a>

            </div>

        </form>


        <!-- DELETE FORM - OUTSIDE UPDATE FORM -->
        <form action="{% url 'delete_turf' turf.id %}" method="POST"
            onsubmit="return confirm('Are you sure you want to delete this turf?');" class="delete-form">

            {% csrf_token %}

            <button type="submit" class="btn btn-danger">
                <i class="fas fa-trash"></i> Delete Turf
            </button>

        </form>



    </div>

</body>

</html>
