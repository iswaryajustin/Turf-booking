<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Turfora · Edit User</title>
    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <!-- Google Font: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: #f0f5fc;
            color: #0b1d2b;
            padding: 1.5rem;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .edit-container {
            max-width: 600px;
            width: 100%;
            background: #ffffff;
            border-radius: 48px;
            box-shadow: 0 30px 60px -20px rgba(0, 20, 30, 0.25), 0 10px 30px -10px rgba(0, 0, 0, 0.05);
            padding: 3rem 3.5rem;
            transition: all 0.2s ease;
        }

        /* header */
        .edit-header {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding-bottom: 1.8rem;
            border-bottom: 1px solid #edf2f7;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }
        .edit-header .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: #5d7388;
            text-decoration: none;
            font-weight: 500;
            transition: 0.15s;
            padding: 0.4rem 1rem;
            border-radius: 40px;
            background: #f0f5fc;
            font-size: 0.9rem;
        }
        .edit-header .back-btn:hover {
            background: #e5edf5;
            color: #1a5cff;
        }
        .edit-header .title-group h2 {
            font-size: 1.6rem;
            font-weight: 700;
            color: #0b1d2b;
        }
        .edit-header .title-group .sub {
            color: #5d7388;
            font-size: 0.9rem;
        }

        /* logo mini */
        .logo-mini {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-left: auto;
            font-weight: 700;
            font-size: 1.1rem;
            color: #0b1d2b;
        }
        .logo-mini svg { width: 30px; height: 30px; }
        .logo-mini span { background: linear-gradient(145deg,#0b1d2b,#1a5cff);  
    background-clip: text; -webkit-background-clip:text; -webkit-text-fill-color:transparent; }

        /* form */
        .edit-form {
            display: flex;
            flex-direction: column;
            gap: 1.4rem;
        }
        .field-group {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }
        .field-group label {
            font-weight: 600;
            font-size: 0.85rem;
            letter-spacing: 0.3px;
            color: #1e3a5f;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .field-group label i {
            color: #7a94af;
            width: 18px;
            font-size: 0.9rem;
        }
        .field-group .input-wrapper {
            display: flex;
            align-items: center;
            background: #fafcff;
            border-radius: 20px;
            border: 1.5px solid #e2eaf2;
            transition: 0.2s ease;
            padding: 0 1.2rem;
        }
        .field-group .input-wrapper:focus-within {
            border-color: #1a5cff;
            background: #ffffff;
            box-shadow: 0 4px 14px rgba(26, 92, 255, 0.08);
        }
        .field-group .input-wrapper input {
            width: 100%;
            padding: 0.85rem 0 0.85rem 0.6rem;
            border: none;
            background: transparent;
            font-size: 1rem;
            font-family: inherit;
            color: #0b1d2b;
            outline: none;
        }
        .field-group .input-wrapper input::placeholder {
            color: #a0b8cf;
            font-weight: 400;
        }
        .field-group .input-wrapper .input-icon {
            color: #7a94af;
            font-size: 0.9rem;
            width: 20px;
        }
        .field-hint {
            font-size: 0.75rem;
            color: #6f8aa3;
            padding-left: 2.2rem;
            margin-top: 0.1rem;
        }

        /* actions */
        .form-actions {
            display: flex;
            gap: 1rem;
            margin-top: 0.8rem;
            padding-top: 1.8rem;
            border-top: 1px solid #edf2f7;
            flex-wrap: wrap;
            align-items: center;
        }
        .btn {
            padding: 0.8rem 2.2rem;
            border-radius: 60px;
            font-weight: 600;
            font-size: 1rem;
            border: none;
            cursor: pointer;
            transition: 0.2s ease;
            font-family: inherit;
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            text-decoration: none;
        }
        .btn-primary {
            background: #1a5cff;
            color: white;
            box-shadow: 0 8px 24px -8px rgba(26, 92, 255, 0.35);
        }
        .btn-primary:hover {
            background: #0f4ad6;
            transform: scale(1.02);
            box-shadow: 0 12px 32px -10px rgba(26, 92, 255, 0.45);
        }
        .btn-outline {
            background: transparent;
            color: #1e3a5f;
            border: 1.5px solid #d0dce8;
        }
        .btn-outline:hover {
            background: #f2f6fe;
            border-color: #b0c6dd;
        }

        /* CSRF token hidden input styling */
        .csrf-field {
            display: none;
        }

        /* responsive */
        @media (max-width: 640px) {
            .edit-container {
                padding: 1.8rem 1.5rem;
                border-radius: 32px;
            }
            .edit-header {
                flex-wrap: wrap;
            }
            .edit-header .title-group h2 {
                font-size: 1.3rem;
            }
            .logo-mini {
                margin-left: 0;
            }
            .field-group .input-wrapper {
                padding: 0 1rem;
            }
            .field-group .input-wrapper input {
                padding: 0.75rem 0 0.75rem 0.4rem;
                font-size: 0.95rem;
            }
            .form-actions {
                flex-direction: column;
                align-items: stretch;
            }
            .btn {
                justify-content: center;
                padding: 0.8rem 1.5rem;
            }
        }
        @media (max-width: 420px) {
            .edit-container {
                padding: 1.2rem 1rem;
                border-radius: 24px;
            }
        }
    </style>
</head>
<body>

    <div class="edit-container">

        <!-- header -->
        <div class="edit-header">
            <a href="{% url 'manageusers'%}" class="back-btn"><i class="fas fa-arrow-left"></i> Back</a>
            <div class="title-group">
                <h2>Edit User</h2>
                <span class="sub">Update user information</span>
            </div>
            <div class="logo-mini">
                <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" style="width:30px;height:30px;">
                    <rect x="4" y="20" width="56" height="28" rx="14" fill="#8BC34A" opacity="0.9" />
                    <rect x="8" y="24" width="48" height="20" rx="10" fill="#689F38" opacity="0.7" />
                    <path d="M18 26 L28 20 L38 26 L32 34 L26 34 L18 26Z" fill="#CDDC39" opacity="0.9" />
                    <path d="M32 20 L38 14 L44 20 L40 26 L34 26 L32 20Z" fill="#FFEB3B" opacity="0.8" />
                    <circle cx="32" cy="40" r="6" fill="#33691E" opacity="0.6" />
                    <circle cx="32" cy="40" r="3" fill="#AFB42B" opacity="0.9" />
                </svg>
                <span>Turfora</span>
            </div>
        </div>

        <!-- edit form with Django template syntax -->
        <form class="edit-form" method="POST">
            <!-- CSRF Token (Django style) -->
            <input type="hidden" name="csrfmiddlewaretoken" value="{{ csrf_token }}" class="csrf-field" />

           
            <!-- Username -->
            <div class="field-group">
                <label for="username"><i class="fas fa-user-circle"></i> Username</label>
                <div class="input-wrapper">
                    <input type="text" id="username" name="username" value="{{user.username}}" placeholder="Enter username" required />
                </div>
                <div class="field-hint">This is the user's public display name.</div>
            </div>

            <!-- Email -->
            <div class="field-group">
                <label for="email"><i class="fas fa-envelope"></i> Email Address</label>
                <div class="input-wrapper">
                    <input type="email" id="email" name="email" value="{{user.email}}" placeholder="Enter email" required />
                </div>
                <div class="field-hint">We'll send booking confirmations here.</div>
            </div>

            <!-- Phone -->
            <div class="field-group">
                <label for="phone"><i class="fas fa-phone"></i> Phone Number</label>
                <div class="input-wrapper">
                    <input type="tel" id="phone" name="phone" value="{{user.phone}}" placeholder="Enter phone number" required />
                </div>
                <div class="field-hint">Used for booking reminders and updates.</div>
            </div>

            <!-- actions -->
            <div class="form-actions">
                <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Update User</button>
                <a href="#" class="btn btn-outline"><i class="fas fa-times"></i> Cancel</a>
            </div>

        </form>

       
    </div>

</body>
</html>
